<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Política de privacidad y términos de uso de Empprende.">
    <title>Empprende | Documentos legales</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202b34;
        --muted: #596a75;
        --blue: #185b72;
        --green: #2f725b;
        --line: #d7e0e3;
        --paper: #ffffff;
        --canvas: #eef3f1;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.65 Georgia, "Times New Roman", serif;
      }
      header {
        padding: 48px max(24px, calc((100% - 860px) / 2));
        background: #d9e8e4;
        border-bottom: 4px solid var(--green);
      }
      header p, nav, .meta, footer { font-family: Arial, Helvetica, sans-serif; }
      header p { margin: 8px 0 0; color: var(--muted); }
      h1, h2, h3 { line-height: 1.2; }
      h1 { margin: 0; font-size: 38px; }
      nav {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        padding: 18px max(24px, calc((100% - 860px) / 2));
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      a { color: var(--blue); }
      main { max-width: 860px; margin: 28px auto; padding: 0 20px; }
      article {
        margin: 0 0 24px;
        padding: 32px clamp(22px, 5vw, 52px);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      article > h2 { margin-top: 0; color: var(--blue); font-size: 28px; }
      h3 { margin: 26px 0 8px; font-size: 19px; }
      .meta { color: var(--muted); font-size: 14px; }
      nav a[aria-current="page"] { font-weight: bold; text-decoration: none; color: var(--ink); }
      footer { padding: 24px; color: var(--muted); text-align: center; }

      @media (max-width: 560px) {
        header { padding-top: 34px; padding-bottom: 34px; }
        h1 { font-size: 32px; }
        article { padding: 24px 20px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Empprende</h1>
      <p>Privacidad y condiciones de uso</p>
    </header>
    <nav aria-label="Documentos">
      <a href="/privacidad">Política de privacidad</a>
      <a href="/terminos">Términos y condiciones</a>
      <a href="mailto:fedelchandia@gmail.com">Contacto</a>
    </nav>
    <main>
      <article>
        <h2>Documentos legales</h2>
        <ul>
          <li><a href="/privacidad">Política de privacidad</a></li>
          <li><a href="/terminos">Términos y condiciones</a></li>
        </ul>
      </article>
    </main>
    <footer>Empprende · Argentina · <a href="mailto:fedelchandia@gmail.com">Contacto</a></footer>
  </body>
</html>
